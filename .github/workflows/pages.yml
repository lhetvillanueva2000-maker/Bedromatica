name: Deploy Schem Bench

# Publishes app/ to the gh-pages branch. The tool is a static page - it reads
# .mcworld files in the browser and never uploads anything - so there is
# nothing to build, just content to copy across.
#
# This uses the branch source rather than actions/deploy-pages because turning
# Pages on for the first time is an owner-only API call that the workflow token
# is not permitted to make. Pushing a gh-pages branch is something the token
# CAN do, and GitHub serves that branch once Pages is pointed at it.
#
# HELD: manual trigger only. The web build is not being published yet - run
# this workflow by hand from the Actions tab when it is time to go live.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push app/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd app

          # Tell Pages to serve the files as-is instead of running Jekyll over them.
          touch .nojekyll

          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy Schem Bench from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

          echo "Published $(git ls-files | wc -l) files to gh-pages."

      - name: Where it will appear
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          echo "::notice title=Schem Bench::https://${owner,,}.github.io/${name}/"
